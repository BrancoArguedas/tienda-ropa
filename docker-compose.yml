# Entorno de DESARROLLO. Para producción usa docker-compose.prod.yml (ver README).
# Las contraseñas se leen de ./.env (copia .env.example); los valores por defecto son solo para desarrollo local.
name: pagina-diana

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./backend:/var/www/backend:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
    depends_on:
      - app

  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_BACKEND_URL: http://nginx
      VITE_POLLING: "1" # los eventos de archivos no cruzan el bind mount de Windows
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules # binarios de Linux, separados de los de Windows
    depends_on:
      - nginx

  mysql:
    image: mysql:8.4
    # Solo accesible desde esta máquina (para clientes SQL); en producción no se publica.
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: tienda
      MYSQL_USER: tienda
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-ft-min-token-size=2"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # La contraseña va por variable de entorno, no en la línea de comandos (visible con ps).
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -uroot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  frontend_node_modules:

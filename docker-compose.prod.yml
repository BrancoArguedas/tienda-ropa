# PRODUCCIÓN: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# - MySQL no se publica fuera de la red interna.
# - Sin servidor de desarrollo Vite: nginx sirve frontend/dist (compilado con "npm run build").
# - nginx escucha solo en localhost:8080; delante va un proxy con HTTPS (Caddy/Cloudflare) que añade HSTS.
name: pagina-diana-prod

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/backend
      # Laravel lee la plantilla compilada del SPA para inyectar el SEO por página
      - ./frontend/dist:/var/www/frontend/dist:ro
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql

  # Tareas programadas (anonimización mensual de pedidos, Ley 29733)
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    user: www-data
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      # Se monta el backend completo para que funcione el enlace public/storage → storage/app/public
      - ./backend:/var/www/backend:ro
      - ./frontend/dist:/var/www/frontend/dist:ro
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tienda
      MYSQL_USER: tienda
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-ft-min-token-size=2"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -uroot"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:

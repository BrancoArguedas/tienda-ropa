# Producción: un solo dominio sirve el SPA compilado (frontend/dist) y la API Laravel.
# TLS/HTTPS lo termina el proxy de delante (Caddy, Cloudflare, Traefik...), que además debe enviar HSTS.
server {
    listen 80;
    server_name _;
    root /var/www/frontend/dist;
    client_max_body_size 60M;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # API, CSRF de Sanctum y healthcheck → Laravel
    location ~ ^/(api|sanctum)/ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_hide_header X-Powered-By;
    }
    location = /up {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
    }

    # Imágenes subidas (re-codificadas a WebP con nombre aleatorio)
    location ^~ /storage/ {
        root /var/www/backend/public;
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
        location ~ \.php$ { return 404; }
        try_files $uri =404;
    }

    # Assets con hash en el nombre: caché larga
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }

    # index.html estático no es una URL pública: la home la sirve Laravel con SEO
    location = /index.html { return 301 /; }

    # Rutas del SPA (React Router): lo que no es un archivo estático lo sirve Laravel
    # (SeoController) con title/canonical/JSON-LD reales, robots.txt, sitemap.xml y 404 reales.
    location / {
        try_files $uri @seo;
    }
    location @seo {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_hide_header X-Powered-By;
        include /etc/nginx/snippets/security-headers.conf;
    }
}

# Desarrollo: nginx sirve solo la API Laravel (el frontend lo sirve Vite en :5173).
server {
    listen 80;
    server_name _;
    root /var/www/backend/public;
    index index.php;
    client_max_body_size 60M;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Solo el front controller ejecuta PHP: ningún otro .php (p. ej. dentro de /storage) se interpreta.
    location = /index.php {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ \.php$ { return 404; }

    location ~* ^/storage/.*\.(webp|jpg|jpeg|png|gif)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) { deny all; }
}
